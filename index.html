<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoS Secure Comms</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* Server Select / Create Screen */
        #login-container {
            background: #0a0a0a; padding: 30px; border: 1px solid #333;
            border-radius: 12px; width: 100%; max-width: 450px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }
        #login-container h2 { text-align: center; margin-bottom: 20px; font-weight: normal; color: #aaa; }
        
        .section-title { font-size: 14px; color: #666; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        #server-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; }
        .server-btn {
            background: #1a1a1a; color: #00a2ff; border: 1px solid #005bb5; padding: 8px 12px;
            border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .server-btn:hover { background: #005bb5; color: white; }

        .create-area { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #111; color: white; outline: none; }
        input:focus { border-color: #005bb5; }
        button.action-btn { padding: 12px 20px; background: #ffffff; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button.action-btn:hover { background: #ccc; }

        /* Chat Interface */
        #chat-container {
            display: none; width: 100%; max-width: 600px; height: 90vh;
            background: #0a0a0a; border: 1px solid #333; border-radius: 12px; flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }
        .header { padding: 20px; border-bottom: 1px solid #222; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .leave-btn { background: #440000; color: white; padding: 8px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
        .leave-btn:hover { background: #ff3333; }
        .messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg-block { display: flex; flex-direction: column; max-width: 80%; }
        .msg-block.left { align-self: flex-start; }
        .msg-block.right { align-self: flex-end; align-items: flex-end; }
        .sender { font-size: 12px; color: #888; margin-bottom: 4px; }
        .bubble { padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.4; }
        .left .bubble { background: #1a1a1a; border-top-left-radius: 2px; }
        .right .bubble { background: #005bb5; border-top-right-radius: 2px; }
        .system .bubble { background: transparent; color: #ffcc00; font-style: italic; border: 1px solid #ffcc00; }
        .input-area { padding: 15px; border-top: 1px solid #222; display: flex; gap: 10px; }
    </style>
</head>
<body>

<div id="login-container">
    <h2>📡 W.O.S. Secure Terminal</h2>
    
    <div class="section-title">ACTIVE SERVERS</div>
    <div id="server-buttons">
        <span style="color:#555; font-size: 13px;">Loading frequencies...</span>
    </div>

    <div class="section-title" style="margin-top: 10px;">CREATE NEW SERVER</div>
    <div class="create-area">
        <input type="text" id="create-input" placeholder="Server Name (e.g. Base1)" autocomplete="off">
        <button class="action-btn" onclick="createNewServer()">Create</button>
    </div>
</div>

<div id="chat-container">
    <div class="header">
        <span id="server-title">Server: </span>
        <button class="leave-btn" onclick="leaveServer()">Disconnect</button>
    </div>
    <div class="messages" id="message-board"></div>
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Transmit message..." autocomplete="off">
        <button class="action-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // ⚠️ REPLACE THIS WITH YOUR FIREBASE URL (Keep the trailing slash /)
    const FIREBASE_BASE_URL = "https://your-firebase-project-default-rtdb.firebaseio.com/";
    
    let currentServer = "";
    let pollInterval = null;

    const loginContainer = document.getElementById('login-container');
    const chatContainer = document.getElementById('chat-container');
    const board = document.getElementById('message-board');

    // Handle Enter Keys
    document.getElementById('create-input').addEventListener("keypress", (e) => { if (e.key === "Enter") createNewServer(); });
    document.getElementById('msg-input').addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

    // Load available servers on boot
    async function loadServerList() {
        try {
            const res = await fetch(`${FIREBASE_BASE_URL}active_servers.json`);
            const data = await res.json();
            const container = document.getElementById('server-buttons');
            container.innerHTML = "";
            
            if (!data) {
                container.innerHTML = '<span style="color:#555; font-size: 13px;">No active servers found.</span>';
                return;
            }

            for (let srv in data) {
                const btn = document.createElement('button');
                btn.className = "server-btn";
                btn.innerText = srv.toUpperCase();
                btn.onclick = () => joinServer(srv);
                container.appendChild(btn);
            }
        } catch (e) { console.error("Failed to load servers."); }
    }

    async function createNewServer() {
        const inputVal = document.getElementById('create-input').value;
        const srv = inputVal.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        if (!srv) return alert("Please enter a valid alphanumeric server name.");
        
        // Register the new server in the active list
        await fetch(`${FIREBASE_BASE_URL}active_servers/${srv}.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ created: new Date().getTime() })
        });
        
        joinServer(srv);
    }

    function joinServer(srvName) {
        currentServer = srvName;
        loginContainer.style.display = "none";
        chatContainer.style.display = "flex";
        document.getElementById('server-title').innerText = `Server: ${currentServer.toUpperCase()}`;
        
        board.innerHTML = ""; 
        appendMessage("SYSTEM", `Connected to encrypted server: ${currentServer.toUpperCase()}`, false, true);
        
        fetchMessages();
        pollInterval = setInterval(fetchMessages, 2000);
    }

    function leaveServer() {
        clearInterval(pollInterval);
        currentServer = "";
        document.getElementById('create-input').value = "";
        chatContainer.style.display = "none";
        loginContainer.style.display = "block";
        loadServerList(); // Refresh the list when returning to the menu
    }

    function appendMessage(sender, text, isWebUser, isSystem = false) {
        const block = document.createElement('div');
        let align = isWebUser ? 'right' : 'left';
        if (isSystem) align = 'system left';
        
        block.className = `msg-block ${align}`;
        block.innerHTML = `<div class="sender">${sender}</div><div class="bubble">${text}</div>`;
        board.appendChild(block);
        board.scrollTop = board.scrollHeight;
    }

    async function sendMessage() {
        const text = document.getElementById('msg-input').value.trim();
        if (!text) return;
        
        appendMessage("WebUser", text, true);
        document.getElementById('msg-input').value = '';

        try {
            await fetch(`${FIREBASE_BASE_URL}servers/${currentServer}.json`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sender: "WebUser", text: text })
            });
        } catch (e) { console.error("Send fail:", e); }
    }

    let lastDataString = "";
    async function fetchMessages() {
        try {
            const res = await fetch(`${FIREBASE_BASE_URL}servers/${currentServer}.json`);
            const data = await res.json();
            if (!data) return;

            const currentDataString = JSON.stringify(data);
            if (currentDataString === lastDataString) return;
            lastDataString = currentDataString;

            board.innerHTML = '';
            appendMessage("SYSTEM", `Connected to encrypted server: ${currentServer.toUpperCase()}`, false, true);
            Object.values(data).forEach(msg => {
                appendMessage(msg.sender, msg.text, msg.sender === "WebUser");
            });
        } catch (e) {}
    }

    // Initialize
    loadServerList();
</script>
</body>
</html>
