<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoS Secure Comms</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* Login / Server Select Screen */
        #login-container {
            background: #0a0a0a;
            padding: 40px;
            border: 1px solid #333;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }
        #login-container h2 { margin-bottom: 20px; font-weight: normal; color: #aaa; }
        #login-container input {
            width: 100%; padding: 12px; margin-bottom: 15px; text-align: center; font-size: 18px;
        }

        /* Chat Interface */
        #chat-container {
            display: none; /* Hidden until connected */
            width: 100%; max-width: 600px; height: 90vh;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 12px;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }
        .header {
            padding: 20px; border-bottom: 1px solid #222; font-size: 20px; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }
        .leave-btn {
            background: #440000; color: white; padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer;
        }
        .leave-btn:hover { background: #ff3333; }
        .messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg-block { display: flex; flex-direction: column; max-width: 80%; }
        .msg-block.left { align-self: flex-start; }
        .msg-block.right { align-self: flex-end; align-items: flex-end; }
        
        .sender { font-size: 12px; color: #888; margin-bottom: 4px; }
        .bubble { padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.4; }
        .left .bubble { background: #1a1a1a; border-top-left-radius: 2px; }
        .right .bubble { background: #005bb5; border-top-right-radius: 2px; }
        .system .bubble { background: transparent; color: #ffcc00; font-style: italic; border: 1px solid #ffcc00; }
        
        .input-area { padding: 15px; border-top: 1px solid #222; display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #111; color: white; outline: none; }
        input:focus { border-color: #005bb5; }
        button { padding: 12px 20px; background: #ffffff; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #ccc; }
    </style>
</head>
<body>

<div id="login-container">
    <h2>📡 W.O.S. Secure Terminal</h2>
    <input type="text" id="server-input" placeholder="Enter Server Name (e.g. Base1)" autocomplete="off">
    <button onclick="joinServer()">Connect / Create</button>
</div>

<div id="chat-container">
    <div class="header">
        <span id="server-title">Server: </span>
        <button class="leave-btn" onclick="leaveServer()">Disconnect</button>
    </div>
    <div class="messages" id="message-board"></div>
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Transmit message..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // ⚠️ REPLACE ONLY THE FIRST PART OF THIS URL! Keep the empty quotes at the end.
    const FIREBASE_BASE_URL = "https://your-firebase-project-default-rtdb.firebaseio.com/";
    
    let currentServer = "";
    let pollInterval = null;

    const loginContainer = document.getElementById('login-container');
    const chatContainer = document.getElementById('chat-container');
    const serverTitle = document.getElementById('server-title');
    const board = document.getElementById('message-board');
    const serverInput = document.getElementById('server-input');
    const msgInput = document.getElementById('msg-input');

    // Handle Enter Keys
    serverInput.addEventListener("keypress", (e) => { if (e.key === "Enter") joinServer(); });
    msgInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

    function getApiUrl() {
        // Formats the URL to target the specific server folder
        return `${FIREBASE_BASE_URL}servers/${currentServer}.json`;
    }

    function joinServer() {
        const srv = serverInput.value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        if (!srv) return alert("Please enter a valid alphanumeric server name.");
        
        currentServer = srv;
        loginContainer.style.display = "none";
        chatContainer.style.display = "flex";
        serverTitle.innerText = `Server: ${currentServer.toUpperCase()}`;
        
        board.innerHTML = ""; // Clear board
        appendMessage("SYSTEM", `Connected to encrypted server: ${currentServer.toUpperCase()}`, false, true);
        
        // Start checking for messages
        fetchMessages();
        pollInterval = setInterval(fetchMessages, 2000);
    }

    function leaveServer() {
        clearInterval(pollInterval);
        currentServer = "";
        serverInput.value = "";
        chatContainer.style.display = "none";
        loginContainer.style.display = "block";
    }

    function appendMessage(sender, text, isWebUser, isSystem = false) {
        const block = document.createElement('div');
        let align = isWebUser ? 'right' : 'left';
        if (isSystem) align = 'system left';
        
        block.className = `msg-block ${align}`;
        block.innerHTML = `
            <div class="sender">${sender}</div>
            <div class="bubble">${text}</div>
        `;
        board.appendChild(block);
        board.scrollTop = board.scrollHeight;
    }

    async function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;
        
        appendMessage("WebUser", text, true);
        msgInput.value = '';

        try {
            await fetch(getApiUrl(), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sender: "WebUser", text: text })
            });
        } catch (e) { console.error("Send fail:", e); }
    }

    let lastDataString = ""; // Prevents redrawing the screen if no new messages

    async function fetchMessages() {
        try {
            const res = await fetch(getApiUrl());
            const data = await res.json();
            
            if (!data) return; // No messages yet

            const currentDataString = JSON.stringify(data);
            if (currentDataString === lastDataString) return; // Nothing changed
            lastDataString = currentDataString;

            board.innerHTML = ''; // Redraw
            appendMessage("SYSTEM", `Connected to encrypted server: ${currentServer.toUpperCase()}`, false, true);
            
            Object.values(data).forEach(msg => {
                appendMessage(msg.sender, msg.text, msg.sender === "WebUser");
            });
        } catch (e) {}
    }
</script>
</body>
</html>
