<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoS Secure Comms</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }
        .header {
            padding: 20px;
            border-bottom: 1px solid #222;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .msg-block {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }
        .msg-block.left { align-self: flex-start; }
        .msg-block.right { align-self: flex-end; align-items: flex-end; }
        
        .sender { font-size: 12px; color: #888; margin-bottom: 4px; }
        .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
        }
        .left .bubble { background: #1a1a1a; border-top-left-radius: 2px; }
        .right .bubble { background: #005bb5; border-top-right-radius: 2px; }
        
        .input-area {
            padding: 15px;
            border-top: 1px solid #222;
            display: flex;
            gap: 10px;
        }
        input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #111;
            color: white;
            outline: none;
        }
        input:focus { border-color: #005bb5; }
        button {
            padding: 12px 20px;
            background: #ffffff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #ccc; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <span>Chat 1</span>
        <span style="color: #444; font-size: 14px; margin-top: 8px;">ENCRYPTED</span>
    </div>
    <div class="messages" id="message-board">
        </div>
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Transmit to base..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // ⚠️ REPLACE THIS URL WITH YOUR MIDDLEMAN API / FIREBASE DATABASE URL
    const API_URL = "https://your-middleman-api.com/messages";
    
    const board = document.getElementById('message-board');
    const input = document.getElementById('msg-input');

    // Handle Enter key
    input.addEventListener("keypress", function(event) {
        if (event.key === "Enter") sendMessage();
    });

    function appendMessage(sender, text, isWebUser) {
        const block = document.createElement('div');
        block.className = `msg-block ${isWebUser ? 'right' : 'left'}`;
        
        block.innerHTML = `
            <div class="sender">${sender}</div>
            <div class="bubble">${text}</div>
        `;
        board.appendChild(block);
        board.scrollTop = board.scrollHeight;
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        
        // Optimistic UI update
        appendMessage("WebUser", text, true);
        input.value = '';

        // Push to database
        try {
            await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sender: "WebUser", text: text })
            });
        } catch (e) {
            console.error("Failed to send:", e);
        }
    }

    // Polling the database every 2 seconds for new messages
    async function fetchMessages() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            
            board.innerHTML = ''; // Clear board
            data.forEach(msg => {
                appendMessage(msg.sender, msg.text, msg.sender === "WebUser");
            });
        } catch (e) {
            // Silently fail if server is unreachable
        }
    }

    setInterval(fetchMessages, 2000);
</script>
</body>
</html>
